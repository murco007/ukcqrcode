async function photoData(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>15*1024*1024)throw Error('請選擇 15MB 以內的 JPG、PNG 或 WebP 圖片。');const bitmap=await createImageBitmap(file);const ratio=Math.min(1,1000/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();let data=canvas.toDataURL('image/jpeg',.8);if(data.length>700000)data=canvas.toDataURL('image/jpeg',.5);if(data.length>700000)throw Error('圖片過大，請選擇較小的照片。');return data;}

async function refresh(){if(polling)return;polling=true;try{if(path==='/'){if(table){const next=await api('/api/table?table='+table);const changed=JSON.stringify(next)!==JSON.stringify(state.table);if(state.table&&next.generation!==state.table.generation){toast('本桌已結帳。新點餐將建立新帳單。');pendingOrder=null;localStorage.removeItem('pending-'+table)}state.table=next;if(changed&&$('#cart'))$('#cart').innerHTML=cartContent();}}else if(state.role){if(path==='/kitchen'||path==='/cashier'){let preChanged=false;if(path==='/cashier'){const next=(await api('/api/preorders')).rows;preChanged=JSON.stringify(next)!==JSON.stringify(state.preorderRows);state.preorderRows=next;}const r=await api('/api/board'+(path==='/kitchen'?'?view=kitchen':''));if(preChanged||JSON.stringify(r.rows)!==JSON.stringify(state.rows)){state.rows=r.rows;if(!$('#modal').innerHTML)render();}}else if(path==='/preorders'){const next=(await api('/api/preorders')).rows;if(JSON.stringify(next)!==JSON.stringify(state.preorderRows)){state.preorderRows=next;if(!$('#modal').innerHTML&&!document.activeElement?.closest('#preorder-create-form,#preorder-update-form'))render();}}else if(path==='/reports'){const r=await api('/api/report?day='+state.day);if(JSON.stringify(r)!==JSON.stringify(state.report)){state.report=r;if(!$('#expense-amount')?.value)render()}}}if(!state.online){state.online=true;render();}}catch(e){if(e.status===401&&path!=='/'){state.role=null;render()}else if(state.online){state.online=false;render()}}finally{polling=false}}

 async function sendConfigured(job){
  const type=mode();if(type==='android-host')return sendAndroid(job);if(type==='usb')return send(job);
  if(type==='serial'||type==='ble'){
   if(!ready())throw Error('請先連接藍牙印表機。');
   const parts=receiptParts(job);if(parts.reduce((sum,part)=>sum+part.length,0)>8000000)throw Error('單據過長，請分批列印。');

   const write=bleCharacteristic;for(const part of parts)for(let offset=0;offset<part.length;offset+=20){const chunk=part.subarray(offset,offset+20);if(write.properties.write&&write.writeValueWithResponse)await write.writeValueWithResponse(chunk);else if(write.properties.writeWithoutResponse&&write.writeValueWithoutResponse){await write.writeValueWithoutResponse(chunk);await new Promise(resolve=>setTimeout(resolve,15));}else await write.writeValue(chunk);}return;
  }
  if(type==='system')throw Error('系統列印／AirPrint 需手動確認，請使用單據中的系統列印按鈕。');
  if(!bridgeReady)throw Error('請先連接 Windows USB 印表機。');
  const parts=receiptParts(job);
  const length=parts.reduce((sum,part)=>sum+part.length,0);
  if(length>8000000)throw Error('單據過長，請分批列印。');
  const bytes=new Uint8Array(length);let offset=0;for(const part of parts){bytes.set(part,offset);offset+=part.length;}
  let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));

 async function connectUSB(){
  if(busy||connecting)throw Error('目前正在列印或連線，請稍候。');
  if(!navigator.usb)throw Error('此 Chrome 不支援 WebUSB，請以電腦 Chrome 開啟 HTTPS 網站。');
  connecting=true;let chosen=null,phase='選擇印表機';
  message('請在 Chrome 裝置視窗中選擇 USB 印表機並允許連線。');

   chosen=await navigator.usb.requestDevice({filters:[{classCode:7},{classCode:255}]});
   if(chosen===device&&device.opened){message('USB 已連接：'+(device.productName||'印表機'));return;}
   if(device?.opened){await device.close();device=null;iface=null;outEndpoint=null;}
   phase='開啟裝置';if(!chosen.opened)await chosen.open();
   if(!chosen.configuration){
    if(!chosen.configurations.length)throw Error('裝置沒有可用 USB 設定。');
    await chosen.selectConfiguration(chosen.configurations[0].configurationValue);
   }
   const candidates=[];
   for(const face of chosen.configuration.interfaces)for(const alt of face.alternates){
    const ep=alt.endpoints.find(e=>e.direction==='out'&&e.type==='bulk');
    if(ep&&(alt.interfaceClass===7||alt.interfaceClass===255))candidates.push({face,alt,ep});
   }
   candidates.sort((a,b)=>(a.alt.interfaceClass===7?0:1)-(b.alt.interfaceClass===7?0:1));
   if(!candidates.length)throw Error('找不到印表機的 Bulk OUT 傳送介面。');
   phase='取得 USB 介面';let lastError;
   for(const candidate of candidates){
    let claimed=false;
    try{
     await chosen.claimInterface(candidate.face.interfaceNumber);claimed=true;
     const live=chosen.configuration.interfaces.find(f=>f.interfaceNumber===candidate.face.interfaceNumber);
     if(live.alternate.alternateSetting!==candidate.alt.alternateSetting)await chosen.selectAlternateInterface(candidate.face.interfaceNumber,candidate.alt.alternateSetting);
     device=chosen;iface=candidate.face.interfaceNumber;outEndpoint=candidate.ep.endpointNumber;
     message('USB 已連接：'+(chosen.productName||'印表機')+'；介面 '+iface+'，可按「測試列印」確認出紙。');return;
    }catch(error){lastError=error;if(claimed)await chosen.releaseInterface(candidate.face.interfaceNumber).catch(()=>{});}
   }
   throw lastError||Error('無法取得 USB 列印介面。');
  }catch(error){
   if(chosen&&chosen!==device&&chosen.opened)await chosen.close().catch(()=>{});

   if(/access denied/i.test(details))throw Error('Windows 拒絕 Chrome 存取 USB（Access denied）。請關閉其他列印程式與重複分頁後重試；若仍被拒絕，可在單據預覽選「系統印表機列印」，透過原有 Windows 驅動出紙。');

  }finally{connecting=false;}

   });

p.querySelector('#cp-auto')?.addEventListener('change',e=>{if(e.target.checked&&!['/kitchen','/cashier','/preorders'].includes(path)){e.target.checked=false;message('請在廚房出餐或前台結帳頁啟用');return;}if(e.target.checked&&mode()==='system'){e.target.checked=false;pref.auto=false;save();toast('系統列印／AirPrint 需手動確認，不能啟用自動列印。');return;}if(e.target.checked&&!ready()){e.target.checked=false;message('請先到左側「列印設定」連接印表機。');toast('請先到「列印設定」連接印表機，再啟用自動列印。');return;}if(e.target.checked&&!confirm('啟用後會列印此工作台尚未處理的待列印工作（包含較早的待印單）。請確認只在一台裝置啟用。')){e.target.checked=false;return;}pref.auto=e.target.checked;save();poll()});
